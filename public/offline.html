<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline · Deutschwerk</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #fafafa; color: #18181b; padding: 24px;
    }
    @media (prefers-color-scheme: dark) { body { background: #0e0e11; color: #fafafa; } }
    .card { text-align: center; max-width: 380px; }
    .emoji { font-size: 56px; }
    h1 { font-size: 24px; margin: 16px 0 8px; letter-spacing: -0.02em; }
    p { color: #71717a; line-height: 1.6; font-size: 15px; }
    .de { margin-top: 20px; font-style: italic; font-size: 14px; color: #a1a1aa; }
    button {
      margin-top: 24px; background: #18181b; color: #fff; border: 0; font-size: 15px;
      font-weight: 600; padding: 12px 28px; border-radius: 12px; cursor: pointer;
    }
    @media (prefers-color-scheme: dark) { button { background: #fafafa; color: #18181b; } }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">📡</div>
    <h1>Du bist offline</h1>
    <p>No internet connection right now. Your progress is safe — reconnect and pick up exactly where you left off.</p>
    <p class="de">„Übung macht den Meister" — practice a word out loud while you wait!</p>
    <button onclick="location.reload()">Try again · Nochmal versuchen</button>
  </div>
</body>
</html>
